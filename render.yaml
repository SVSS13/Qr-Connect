# Render Blueprint specification for zero-config QR Connect deployment
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: qrconnect-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PROJECT_NAME
        value: "QR Connect"
      - key: DATABASE_URL
        fromDatabase:
          name: qrconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_MINUTES
        value: "60"
      - key: JWT_REFRESH_EXPIRY_DAYS
        value: "30"
      - key: SESSION_EXPIRY_MINUTES
        value: "5"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: uploads
      - key: FCM_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: qrconnect-db
    databaseName: qrconnect
    user: qrconnect
    region: oregon
    plan: free
