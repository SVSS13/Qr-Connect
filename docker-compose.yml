version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: qrconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: qrconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qrconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrconnect-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=QR Connect
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/qrconnect
      - SECRET_KEY=production-secret-key-change-me-qrconnect-2026
      - CORS_ORIGINS=*
      - SESSION_EXPIRY_MINUTES=5
      - RATE_LIMIT_PER_MINUTE=60
      - STORAGE_BACKEND=local
      - UPLOAD_DIR=uploads
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
